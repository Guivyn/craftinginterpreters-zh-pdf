<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Crafting Interpreters 纯中文版 PDF</title>
  <desc id="hero-desc">一份 650 页的中文排版整理版，从 Lox 出发，沿着扫描、解析、语法树、字节码和虚拟机的路线理解解释器。</desc>

  <rect width="1200" height="450" rx="30" fill="#f5f1e8"/>
  <path d="M52 58H1148" stroke="#1d1d1b" stroke-width="2"/>
  <path d="M52 404H1148" stroke="#1d1d1b" stroke-width="2"/>
  <circle cx="72" cy="38" r="6" fill="#c96545"/>
  <circle cx="92" cy="38" r="6" fill="#1d1d1b"/>
  <circle cx="112" cy="38" r="6" fill="#9a958a"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="60" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4" fill="#c96545">CHINESE TRANSLATION · PDF EDITION</text>
    <text x="60" y="168" font-size="62" font-weight="700" letter-spacing="-1" fill="#1d1d1b">Crafting</text>
    <text x="60" y="234" font-size="62" font-weight="700" letter-spacing="-1" fill="#1d1d1b">Interpreters</text>
    <text x="64" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#4c4a45">FROM FIRST LINE TO A RUNNING VM.</text>
    <text x="64" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6e6a61">650 PAGES  ·  CHAPTERS 1—30  ·  APPENDICES I—II</text>
  </g>

  <g id="project-proof" transform="translate(708 84)">
    <path d="M0 20C57 4 114 4 171 20V302C114 286 57 286 0 302Z" fill="#fffdf8" stroke="#1d1d1b" stroke-width="2"/>
    <path d="M171 20C228 4 285 4 342 20V302C285 286 228 286 171 302Z" fill="#ebe5d8" stroke="#1d1d1b" stroke-width="2"/>
    <path d="M171 20V302" stroke="#1d1d1b" stroke-width="2"/>

    <path d="M30 66H148M30 88H148M30 110H126" stroke="#9a958a" stroke-width="5" stroke-linecap="round"/>
    <path d="M194 66H312M194 88H312M194 110H290" stroke="#9a958a" stroke-width="5" stroke-linecap="round"/>

    <g id="interpreter-flow" transform="translate(18 148)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="0" y="0" width="86" height="42" rx="8" fill="#1d1d1b"/>
      <text x="43" y="27" text-anchor="middle" font-size="17" fill="#f5f1e8">SCAN</text>
      <path d="M96 21H112" stroke="#c96545" stroke-width="3"/>
      <path d="M104 14L112 21L104 28" fill="none" stroke="#c96545" stroke-width="3"/>

      <rect x="120" y="0" width="86" height="42" rx="8" fill="#c96545"/>
      <text x="163" y="27" text-anchor="middle" font-size="17" fill="#fffdf8">PARSE</text>
      <path d="M216 21H240" stroke="#c96545" stroke-width="3"/>
      <path d="M232 14L240 21L232 28" fill="none" stroke="#c96545" stroke-width="3"/>

      <rect x="248" y="0" width="58" height="42" rx="8" fill="#1d1d1b"/>
      <text x="277" y="27" text-anchor="middle" font-size="15" fill="#f5f1e8">VM</text>
    </g>

    <g id="syntax-graph" transform="translate(38 232)">
      <circle cx="0" cy="0" r="11" fill="#c96545"/>
      <circle cx="78" cy="-28" r="11" fill="#1d1d1b"/>
      <circle cx="78" cy="28" r="11" fill="#1d1d1b"/>
      <circle cx="156" cy="0" r="11" fill="#c96545"/>
      <path d="M11 -3L67 -24M11 3L67 24M89 -24L145 -3M89 24L145 3" fill="none" stroke="#6e6a61" stroke-width="3"/>
