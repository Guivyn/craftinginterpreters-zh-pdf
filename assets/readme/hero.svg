      <text x="154" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4c4a45">BYTECODE</text>
    </g>
  </g>

  <text x="60" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#6e6a61">READ · TRACE · BUILD</text>
